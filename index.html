<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Tracker | Sprint 1</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">CS 319 · Sprint 1</p>
      <h1>🐾 Cat Tracker</h1>
      <p>Keep your cats' information organized in one place.</p>
    </header>
    <section class="panel" aria-labelledby="form-heading">
      <h2 id="form-heading">Add a cat</h2>
      <form id="cat-form" novalidate>
        <input id="cat-id" type="hidden">
        <div class="fields">
          <label>Cat's name <input id="name" type="text" maxlength="40" autocomplete="off" required placeholder="e.g., Chunchun"></label>
          <label>Age (years) <input id="age" type="number" min="0" max="40" step="0.1" required placeholder="e.g., 2"></label>
          <label>Breed <input id="breed" type="text" maxlength="50" autocomplete="off" required placeholder="e.g., Persian"></label>
        </div>
        <p id="form-message" class="message" role="status" aria-live="polite"></p>
        <div class="actions"><button id="save-button" type="submit">Save cat</button><button id="cancel-button" type="button" class="secondary" hidden>Cancel edit</button></div>
      </form>
    </section>
    <section class="panel" aria-labelledby="list-heading">
      <div class="list-heading"><h2 id="list-heading">My cats</h2><span id="cat-count" class="count">0 cats</span></div>
      <p id="empty-state" class="empty">No cats added yet. Add your first cat above!</p>
      <div id="cat-list" class="cat-list" aria-live="polite"></div>
    </section>
    <footer>Prototype only — live GPS tracking will be added in a future sprint.</footer>
  </main>
</body>
</html>
